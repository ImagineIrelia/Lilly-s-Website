<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Eine Frage an dich</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      overflow:hidden;

      font-family:'Poppins', sans-serif;

      background:
        radial-gradient(circle at top, rgba(255,180,200,0.15), transparent 30%),
        radial-gradient(circle at bottom, rgba(255,120,160,0.12), transparent 30%),
        linear-gradient(135deg, #120b14, #1d1020, #2a1427);

      color:white;
      position:relative;
    }

    /* Hintergrund Glow */

    .glow{
      position:absolute;

      width:500px;
      height:500px;

      background:rgba(255,120,170,0.15);

      border-radius:50%;

      filter:blur(120px);

      animation:float 8s ease-in-out infinite;
    }

    .glow:nth-child(1){
      top:-150px;
      left:-100px;
    }

    .glow:nth-child(2){
      bottom:-150px;
      right:-100px;

      animation-delay:4s;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-25px);
      }
    }

    .container{
      position:relative;
      z-index:2;

      width:90%;
      max-width:500px;

      padding:45px 30px;

      border:1px solid rgba(255,255,255,0.12);

      background:rgba(255,255,255,0.08);

      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);

      border-radius:30px;

      text-align:center;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.35),
        0 0 25px rgba(255,120,170,0.08);

      animation:fadeIn 1.2s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .subtitle{
      font-size:0.9rem;

      letter-spacing:3px;
      text-transform:uppercase;

      opacity:0.7;

      margin-bottom:22px;
    }

    h1{
      font-family:'Parisienne', cursive;

      font-size:3rem;
      line-height:1.3;
      font-weight:400;

      margin-bottom:22px;

      letter-spacing:1px;

      color:#ffd6e7;

      text-shadow:
        0 0 10px rgba(255,182,193,0.35);
    }

    .description{
      font-size:1rem;

      line-height:1.7;

      opacity:0.82;

      margin-bottom:40px;
    }

    .buttons{
      display:flex;

      gap:16px;

      justify-content:center;

      flex-wrap:wrap;
    }

    button{
      border:none;
      outline:none;

      cursor:pointer;

      padding:14px 28px;

      min-width:140px;

      border-radius:999px;

      font-size:1rem;
      font-weight:500;

      transition:all 0.25s ease;

      font-family:'Poppins', sans-serif;
    }

    .yes-btn{
      background:linear-gradient(135deg, #ff6fa5, #ff4d88);

      color:white;

      box-shadow:
        0 8px 20px rgba(255,77,136,0.35);
    }

    .yes-btn:hover{
      transform:translateY(-3px) scale(1.03);

      box-shadow:
        0 12px 25px rgba(255,77,136,0.45);
    }

    .no-btn{
      background:rgba(255,255,255,0.08);

      color:white;

      border:1px solid rgba(255,255,255,0.15);
    }

    .no-btn:hover{
      transform:translateY(-3px);

      background:rgba(255,255,255,0.14);
    }

    .message{
      margin-top:30px;

      min-height:28px;

      font-size:1rem;

      opacity:0;

      transition:0.4s ease;
    }

    .show-message{
      opacity:1;
    }

    /* Mobile */

    @media(max-width:480px){

      h1{
        font-size:2.4rem;
      }

      .description{
        font-size:0.95rem;
      }

      button{
        width:100%;
      }

      .buttons{
        flex-direction:column;
      }
    }

  </style>
</head>

<body>

  <!-- Hintergrund Glow -->

  <div class="glow"></div>
  <div class="glow"></div>

  <div class="container">

    <div class="subtitle">
      Liebe Lilly
    </div>

    <h1>
      Möchtest du mit mir ausgehen?
    </h1>

    <div class="buttons">

      <button class="yes-btn" id="yesBtn">
        Ja ❤️
      </button>

      <button class="no-btn" id="noBtn">
        Nein 💔
      </button>

    </div>

    <div class="message" id="message"></div>

  </div>

  <script>

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");

    /*
      SPÄTER ERWEITERBAR:
      - Animationen
      - Musik
      - Bilder
      - Weiterleitungen
      - Countdown
      - Kalenderdaten
      - Fireworks
      - Herzregen
    */

    yesBtn.addEventListener("click", () => {

      message.classList.add("show-message");

      message.innerHTML =
        "Du hast gerade jemanden sehr glücklich gemacht ❤️";

    });

    noBtn.addEventListener("click", () => {

      message.classList.add("show-message");

      message.innerHTML =
        "Hmm... vielleicht brauche ich einfach noch einen besseren Plan 👀";

    });

  </script>

</body>
</html>
