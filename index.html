<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eine Frage an dich</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,180,200,0.15), transparent 30%),
        radial-gradient(circle at bottom, rgba(255,120,160,0.12), transparent 30%),
        linear-gradient(135deg, #120b14, #1d1020, #2a1427);
      color: white;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255,120,170,0.15);
      border-radius: 50%;
      filter: blur(120px);
      animation: float 8s ease-in-out infinite;
    }

    .glow:nth-child(1) { top: -150px; left: -100px; }
    .glow:nth-child(2) { bottom: -150px; right: -100px; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-25px); }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 500px;
      padding: 45px 30px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35), 0 0 25px rgba(255,120,170,0.08);
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 22px;
    }

    h1 {
      font-family: 'Parisienne', cursive;
      font-size: 3rem;
      line-height: 1.3;
      font-weight: 400;
      margin-bottom: 22px;
      letter-spacing: 1px;
      color: #ffd6e7;
      text-shadow: 0 0 10px rgba(255,182,193,0.35);
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      min-height: 60px;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      padding: 14px 28px;
      min-width: 140px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.25s ease;
      font-family: 'Poppins', sans-serif;
    }

    .yes-btn {
      background: linear-gradient(135deg, #ff6fa5, #ff4d88);
      color: white;
      box-shadow: 0 8px 20px rgba(255,77,136,0.35);
    }

    .yes-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 25px rgba(255,77,136,0.45);
    }

    .no-btn {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      position: relative;
      transition: all 0.3s ease;
    }

    .no-btn:hover {
      background: rgba(255,255,255,0.14);
    }

    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    .popup-overlay.active {
      display: flex;
    }

    .popup-box {
      background: linear-gradient(135deg, rgba(30,12,28,0.95), rgba(40,18,38,0.95));
      border: 1px solid rgba(255,120,170,0.3);
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 380px;
      width: 88%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,100,160,0.12);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .popup-emoji {
      font-size: 2.8rem;
      margin-bottom: 16px;
      display: block;
    }

    .popup-text {
      font-family: 'Parisienne', cursive;
      font-size: 1.6rem;
      color: #ffd6e7;
      line-height: 1.5;
      margin-bottom: 28px;
      text-shadow: 0 0 8px rgba(255,182,193,0.3);
    }

    .popup-close {
      background: linear-gradient(135deg, #ff6fa5, #ff4d88);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255,77,136,0.35);
      transition: all 0.2s ease;
      min-width: auto;
    }

    .popup-close:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 10px 22px rgba(255,77,136,0.45);
    }

    .heart-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 998;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      top: -50px;
      font-size: 1.4rem;
      animation: fall linear forwards;
      opacity: 0.85;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(20deg); opacity: 0; }
    }

    @media(max-width: 480px) {
      h1 { font-size: 2.4rem; }
      button { width: 100%; }
      .buttons { flex-direction: column; }
    }
  </style>
</head>

<body>

  <div class="glow"></div>
  <div class="glow"></div>

  <div class="heart-container" id="heartContainer"></div>

  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box" id="popupBox">
      <span class="popup-emoji" id="popupEmoji">❤️</span>
      <p class="popup-text" id="popupText"></p>
      <button class="popup-close" onclick="closePopup()">Schließen</button>
    </div>
  </div>

  <audio id="song" preload="auto">
    <source src="https://raw.githubusercontent.com/ImagineIrelia/lilly/main/AdoreYou.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <div class="subtitle">Liebe Lilly</div>
    <h1>Möchtest du mit mir ausgehen?</h1>
    <div class="buttons" id="buttonsArea">
      <button class="yes-btn" id="yesBtn">Ja ❤️</button>
      <button class="no-btn"  id="noBtn">Nein 💔</button>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1506559688639250533/ro-l0MFDD85d8yzYTd4_fWwmQMKggIjIokr3uyb_FtOCPXX0vDb7RoLf94Hg841dN5mJ";

    const yesBtn   = document.getElementById("yesBtn");
    const noBtn    = document.getElementById("noBtn");
    const overlay  = document.getElementById("popupOverlay");
    const popText  = document.getElementById("popupText");
    const popEmoji = document.getElementById("popupEmoji");
    const song     = document.getElementById("song");

    let noClickCount = 0;
    let decided      = false;

    function sendToDiscord(answer) {
      const now = new Date().toLocaleString("de-DE", { timeZone: "Europe/Berlin" });
      fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          embeds: [{
            title: "💌 Lilly hat geantwortet!",
            description: `**Antwort:** ${answer}`,
            color: answer === "JA ❤️" ? 0xff4d88 : 0x888888,
            footer: { text: `Zeitpunkt: ${now}` }
          }]
        })
      }).catch(err => console.warn("Webhook-Fehler:", err));
    }

    function startHeartRain() {
      const container = document.getElementById("heartContainer");
      const emojis = ["❤️","💕","💖","💗","💓","🌹","✨"];
      let count = 0;
      const interval = setInterval(() => {
        const el = document.createElement("div");
        el.classList.add("heart");
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.fontSize = (1 + Math.random() * 1.5) + "rem";
        const dur = 2.5 + Math.random() * 2.5;
        el.style.animationDuration = dur + "s";
        container.appendChild(el);
        setTimeout(() => el.remove(), dur * 1000);
        if (++count >= 60) clearInterval(interval);
      }, 80);
    }

    function openPopup(emoji, text, isIrreversible = false) {
      popEmoji.textContent = emoji;
      popText.textContent  = text;
      overlay.classList.add("active");
      const closeBtn = document.querySelector(".popup-close");
      closeBtn.style.display = isIrreversible ? "none" : "inline-block";
    }

    function closePopup() {
      overlay.classList.remove("active");
    }

    yesBtn.addEventListener("click", () => {
      if (decided) return;

      noBtn.style.display = "none";
      song.volume = 0.6;
      song.play().catch(() => {});
      startHeartRain();
      openPopup("❤️", "Ich freue mich auf unsere gemeinsame Zeit, ich werde alles geben um dich glücklich zu machen");
      sendToDiscord("JA ❤️");
    });

    noBtn.addEventListener("click", () => {
      if (decided) return;

      noClickCount++;

      if (noClickCount === 1) {
        moveButton();
        return;
      }

      if (noClickCount === 2) {
        moveButton();
        noBtn.textContent = "Bist du sicher? 🥺";
        return;
      }

      decided = true;
      yesBtn.style.display = "none";
      noBtn.style.display  = "none";
      openPopup("💔", "Danke für die gemeinsamen Momente", true);
      sendToDiscord("NEIN 💔");
    });

    function moveButton() {
      const bRect = noBtn.getBoundingClientRect();
      const maxX  = Math.min(window.innerWidth  - bRect.width  - 20, 200);
      const maxY  = Math.min(window.innerHeight - bRect.height - 20, 80);
      const rx = (Math.random() * maxX * 2 - maxX);
      const ry = (Math.random() * maxY * 2 - maxY);
      const cur = noBtn._offset || { x: 0, y: 0 };
      const nx  = cur.x + rx;
      const ny  = cur.y + ry;
      noBtn._offset         = { x: nx, y: ny };
      noBtn.style.transform = `translate(${nx}px, ${ny}px)`;
      noBtn.style.position  = "relative";
    }
  </script>

</body>
</html>
